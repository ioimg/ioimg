[workspace]
resolver = "2"
members = ["core", "io", "http", "srv-tokio", "srv-compio", "tools", "vips-bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
blake3 = "1"
futures-channel = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif"] }
io-uring = "0.7"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs", "time", "signal"] }
compio = { version = "0.19", features = ["macros", "net", "time"] }
cyper-axum = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
